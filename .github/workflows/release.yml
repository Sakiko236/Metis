name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Metis Binaries
        shell: cmd
        run: |
          build.bat

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Metis ${{ github.ref_name }}
          files: |
            Metis.exe
            Metis-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎯 Metis ${{ github.ref_name }} Release

            Welcome to the initial official release of **Metis** — the laser-focused, file-centric micro-agent designed for surgical code modifications with zero blast radius.

            #### ✨ Key Highlights
            * **Laser-Focused File Whitelist**: Metis strictly scopes its context to files explicitly provided by you, preventing token dilution and hallucinations.
            * **Zero Blast Radius**: Creating new files and deleting existing files are strictly prohibited. Edits are performed in-place using exact Search/Replace blocks.
            * **Autonomous Live Web Search**: Query public technical documentation and troubleshooting guides in real time via `<metis_search>`.
            * **Native Multimodal Support**: Drag and drop PDF specification documents and screenshot images directly for multimodal understanding.
            * **Multi-Vendor LLM Connectivity**: Native streaming support for DeepSeek, OpenAI, Anthropic Claude, Google Gemini, Kimi/Moonshot, Zhipu GLM, and local Ollama models.
            * **Zero-Dependency Native Windows App**: Built with pure .NET Framework 4.8 and WebView2.

            ---

            #### 📦 Downloads
            * **Portable Executable**: Download **`Metis.exe`** and run directly with zero installation.
            * **Windows Installer**: Download **`Metis-Setup.exe`** for automated installation to `%LOCALAPPDATA%\Programs\Metis` with Desktop and Start Menu shortcuts.
