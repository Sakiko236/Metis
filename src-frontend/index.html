    width: min(1080px, 94vw);
    height: min(840px, 86vh);
    max-height: 880px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .inspector-stats-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: rgba(0, 0, 0, 0.22);
    border-bottom: 1px solid var(--border-subtle);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .diff-stat-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-mono);
  }
  .diff-stat-chip.add {
    background: rgba(16, 185, 129, 0.15);
    color: #34D399;
  }
  .diff-stat-chip.del {
    background: rgba(239, 68, 68, 0.15);
    color: #F87171;
  }
  .diff-stat-chip.neutral {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
  }
  .diff-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    flex: 1;
    padding: 4px 2px;
  }
  .diff-file-card {
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: #0B0E17;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  .diff-file-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: #111625;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 12px;
    gap: 10px;
  }
  .diff-file-body {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.65;
    overflow-x: auto;
    padding: 6px 0;
    user-select: text !important;
    -webkit-user-select: text !important;
  }
  .diff-chunk-divider {
    padding: 5px 14px;
    font-size: 11.5px;
    color: #38BDF8;
    background: rgba(14, 165, 233, 0.08);
    border-top: 1px solid rgba(14, 165, 233, 0.18);
    border-bottom: 1px solid rgba(14, 165, 233, 0.18);
    font-family: var(--font-mono);
    font-weight: 600;
  }
  /* Code Syntax Highlighting Tokens */
  .syn-comment { color: #64748B; font-style: italic; }
  .syn-string  { color: #FCD34D; }
  .syn-number  { color: #FB923C; }
  .syn-keyword { color: #C084FC; font-weight: 600; }
  .syn-type    { color: #6EE7B7; }
  .syn-func    { color: #38BDF8; }

  [data-theme="light"] .syn-comment { color: #6B7280; font-style: italic; }
  [data-theme="light"] .syn-string  { color: #B45309; }
  [data-theme="light"] .syn-number  { color: #C2410C; }
  [data-theme="light"] .syn-keyword { color: #7E22CE; font-weight: 600; }
  [data-theme="light"] .syn-type    { color: #047857; }
  [data-theme="light"] .syn-func    { color: #0284C7; }

  /* Full File Code Viewer in Modal */
  .code-viewer-container {
    background: #0B0E17;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 8px 0;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.65;
    overflow-y: auto;
    flex: 1;
    user-select: text !important;
    -webkit-user-select: text !important;
  }
  .code-line {
    display: flex;
    align-items: baseline;
    padding: 1.5px 0;
    min-height: 22px;
    transition: background 0.1s;
  }
  .code-line:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .code-line-num {
    width: 44px;
    padding-right: 12px;
    text-align: right;
    color: rgba(255, 255, 255, 0.28);
    user-select: none;
    -webkit-user-select: none;
    flex-shrink: 0;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .code-line-content {
    flex: 1;
    padding-right: 14px;
    white-space: pre-wrap;
    word-break: break-all;
    color: #E2E8F0;
  }

  /* Diff Line Coloring & Gutters */
  .diff-line {
    display: flex;
    align-items: baseline;
    padding: 2.5px 0;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    transition: background 0.1s;
  }
  .diff-line:hover {
    filter: brightness(1.08);
  }
  .diff-line-prefix {
    width: 32px;
    flex-shrink: 0;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    font-weight: 700;
    font-size: 12px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    margin-right: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.95;
  }
  .diff-line-content {
    flex: 1;
    padding-right: 14px;
  }
  .diff-line-del {
    background: rgba(239, 68, 68, 0.16);
    color: #FECDD3;
    border-left: 3.5px solid #EF4444;
  }
  .diff-line-del .diff-line-prefix {
    background: rgba(239, 68, 68, 0.25);
    color: #FCA5A5;
    border-right-color: rgba(239, 68, 68, 0.3);
  }
  [data-theme="light"] .diff-line-del {
    background: rgba(239, 68, 68, 0.1);
    color: #991B1B;
    border-left: 3.5px solid #DC2626;
  }
  [data-theme="light"] .diff-line-del .diff-line-prefix {
    background: rgba(239, 68, 68, 0.18);
    color: #DC2626;
  }
  .diff-line-add {
    background: rgba(16, 185, 129, 0.16);
    color: #D1FAE5;
    border-left: 3.5px solid #10B981;
  }
  .diff-line-add .diff-line-prefix {
    background: rgba(16, 185, 129, 0.25);
    color: #6EE7B7;
    border-right-color: rgba(16, 185, 129, 0.3);
  }
  [data-theme="light"] .diff-line-add {
    background: rgba(16, 185, 129, 0.1);
    color: #065F46;
    border-left: 3.5px solid #059669;
  }
  [data-theme="light"] .diff-line-add .diff-line-prefix {
    background: rgba(16, 185, 129, 0.18);
    color: #059669;
  }
  .diff-line-ctx {
    background: rgba(255, 255, 255, 0.015);
    color: #E2E8F0;
    border-left: 3.5px solid transparent;
  }
  .diff-line-ctx:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .diff-line-ctx .diff-line-prefix {
    background: rgba(255, 255, 255, 0.03);
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<div class="resize-handle resize-top" data-edge="top"></div>
<div class="resize-handle resize-bottom" data-edge="bottom"></div>
<div class="resize-handle resize-left" data-edge="left"></div>
<div class="resize-handle resize-right" data-edge="right"></div>
<div class="resize-handle resize-top-left" data-edge="topleft"></div>
<div class="resize-handle resize-top-right" data-edge="topright"></div>
<div class="resize-handle resize-bottom-left" data-edge="bottomleft"></div>
<div class="resize-handle resize-bottom-right" data-edge="bottomright"></div>
<header class="window-titlebar" id="windowTitlebar">
  <div class="titlebar-drag-area" id="titlebarDragArea">
    <div class="titlebar-brand">
      <div class="titlebar-logo-icon" id="titlebarMascot" title="Metis Mascot - click to change mood!"></div>
      <span class="titlebar-app-name">Metis</span>
      <span class="titlebar-sep">/</span>
      <span class="titlebar-session-name" id="titlebarSessionName">Default Chat</span>
    </div>
  </div>
  <div class="titlebar-controls">
    <button class="win-btn" id="winMinBtn" title="Minimize" onclick="hostPost({ action: 'windowMin' })" tabindex="-1">
      <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
    </button>
    <button class="win-btn" id="winMaxBtn" title="Maximize" onclick="hostPost({ action: 'windowMax' })" tabindex="-1">
      <svg id="iconWinMax" width="10" height="10" viewBox="0 0 10 10">
        <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
      <svg id="iconWinRestore" style="display:none;" width="10" height="10" viewBox="0 0 10 10">
        <path d="M2.5 0.5h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1"/>
        <path d="M0.5 2.5h7v7h-7z" fill="var(--titlebar-bg)" stroke="currentColor" stroke-width="1"/>
      </svg>
    </button>
    <button class="win-btn win-close" id="winCloseBtn" title="Close" onclick="hostPost({ action: 'windowClose' })" tabindex="-1">
      <svg width="10" height="10" viewBox="0 0 10 10">
        <line x1="0.5" y1="0.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.2"/>
        <line x1="9.5" y1="0.5" x2="0.5" y2="9.5" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>
</header>
<div class="app-shell">
  <!-- Left Sidebar: Chat List + Settings Entry -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-left">
        <div class="brand-logo" id="brandMascot" title="Metis Mascot - click to change mood!"></div>
        <div>
          <div class="brand-title">Metis</div>
          <div class="brand-sub">File-Centric Mini Agent</div>
        </div>
      </div>
    </div>

    <div class="sidebar-actions">
      <button class="btn-new-session btn-new-chat" onclick="createNewSession()" title="Start a new chat">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New chat</span>
      </button>
      <div class="search-box">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sessionSearchInput" placeholder="Search local chats..." oninput="renderSessionList()" />
      </div>
    </div>

    <div class="session-section-label">
      <span>Local chats</span>
      <span id="sessionCountBadge">1</span>
    </div>

    <div class="session-list" id="sessionListContainer"></div>

    <div class="sidebar-footer">
      <div class="active-provider-card" onclick="openSettingsModal()" title="Click to configure AI providers and API keys">
        <div style="display:flex;align-items:center;gap:9px;min-width:0;">
          <div id="footerProviderDot" class="provider-dot"></div>
          <div style="min-width:0;">
            <div id="footerVendorName" style="display:none;"></div>
            <div id="footerModelName" style="font-size:12px;font-weight:600;color:var(--text-primary);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">(No model specified)</div>
          </div>
        </div>
        <span style="font-size:11px;color:var(--text-secondary);flex-shrink:0;">Switch ▸</span>
      </div>

      <button class="btn-settings" onclick="openSettingsModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main class="main-workspace">
    <!-- Top Workspace Header -->
    <header class="workspace-header">
      <div class="header-session-title">
        <span id="currentSessionTitle">Default Chat</span>
      </div>
      <div class="header-right">
        <button class="icon-btn-sm" onclick="promptRenameActiveSession()" title="Rename current chat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
    </header>

    <!-- Controlled File & Folder Whitelist Strip -->
    <section class="whitelist-strip" id="whitelistStripContainer"></section>

    <!-- Chat & Autonomous Verification Stream -->
    <section class="chat-stream selectable" id="chatStreamContainer"></section>

    <!-- Bottom Floating Composer -->
    <footer class="composer-container">
      <div class="composer-box">
        <textarea
          id="promptInput"
          class="composer-textarea selectable"
          placeholder="Send a message or instruction... (Enter to send, Shift+Enter for newline)"
          onkeydown="handleComposerKeydown(event)"
          onpaste="handleComposerPaste(event)"
        ></textarea>

        <div class="composer-footer">
          <div class="composer-tools">
            <button class="tool-btn" onclick="hostPost({ action: 'pickFiles' })" title="Add files">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span>Files</span>
            </button>
            <button class="tool-btn" onclick="hostPost({ action: 'pickFolder' })" title="Add folder">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span>Folder</span>
            </button>
            <input type="file" id="mediaFileInput" accept="image/*,.pdf,application/pdf" multiple style="display:none;" onchange="handleMediaFileInput(this)">
            <button class="tool-btn" onclick="triggerMediaPicker()" title="Add image or PDF">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Image/PDF</span>
            </button>

            <div class="thinking-control-group" title="Configure thinking / reasoning budget (Thinking Budget)">
              <div class="thinking-label-wrap">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="thinking-bulb-icon">
                  <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
                  <line x1="9" y1="21" x2="15" y2="21"/>
                </svg>
                <span class="thinking-title">Thinking</span>
              </div>
              <div class="thinking-slider-track" id="thinkingSliderTrack">
                <div class="thinking-slider-glider" id="thinkingGlider"></div>
                <button type="button" class="thinking-seg-btn" data-val="low" onclick="setThinkingIntensity('low')">Low</button>
                <button type="button" class="thinking-seg-btn active" data-val="medium" onclick="setThinkingIntensity('medium')">Med</button>
                <button type="button" class="thinking-seg-btn" data-val="high" onclick="setThinkingIntensity('high')">High</button>
              </div>
            </div>
          </div>

          <div class="composer-actions">
            <button id="stopBtn" class="btn-action-icon stop" style="display:none;" onclick="stopCurrentLoop()" title="Stop">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect width="24" height="24" rx="4"/></svg>
            </button>
            <button id="sendBtn" class="btn-send-round" onclick="sendPrompt()" title="Send (Enter)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </main>
</div>

<!-- Full-Window Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
  <div style="background:var(--bg-sidebar);padding:18px 28px;border-radius:12px;border:1px solid var(--accent-emerald);text-align:center;box-shadow:0 16px 40px rgba(0,0,0,0.6);">
    <div style="font-size:15px;font-weight:600;color:#38BDF8;">Drop files or folders to add to whitelist</div>
  </div>
</div>

<!-- Settings Modal (API Key & Multi-Vendor Configuration) -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal-window">
    <div class="modal-header">
      <div class="modal-title" style="display:flex;align-items:center;gap:9px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
        <span class="version-pill" id="appVersionPill"></span>
      </div>
      <button class="icon-btn-sm" onclick="closeSettingsModal()">✕</button>
    </div>

    <div class="modal-body-split">
      <div class="settings-rail" id="settingsVendorRail"></div>
      <div class="settings-pane" id="settingsVendorPane"></div>
    </div>

    <div class="modal-footer">
      <div style="display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--text-muted);min-width:0;flex:1;">
        <span id="configPathHint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Local storage: %APPDATA%\Metis\config.json</span>
        <span id="autoSaveIndicator" style="display:inline-flex;align-items:center;gap:4px;color:#38BDF8;font-weight:600;opacity:0;transition:opacity 0.2s ease;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Saved
        </span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-shrink:0;">
        <button class="btn-primary" onclick="closeSettingsModal()">Done</button>
      </div>
    </div>
  </div>
</div>

<!-- File Inspector Modal -->
<div class="modal-backdrop" id="inspectorModal">
  <div class="modal-window inspector-modal-window">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div class="modal-title" id="inspectorTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Inspect Code</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-secondary" id="inspectorCopyAllBtn" style="padding:3px 9px;font-size:11.5px;" onclick="copyInspectorContent(this)">Copy All</button>
        <button class="icon-btn-sm" onclick="closeInspectorModal()">✕</button>
      </div>
    </div>
    <div class="inspector-stats-bar" id="inspectorStatsBar">
      <div id="inspectorMeta" style="font-size:12px;color:var(--text-secondary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
      <div id="inspectorStatsChips" style="display:flex;align-items:center;gap:6px;"></div>
    </div>
    <div style="flex:1;padding:12px 18px;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:0;">
      <div id="inspectorImageContainer" style="display:none;flex:1;overflow:auto;background:#080A0F;border:1px solid var(--border-subtle);border-radius:8px;align-items:center;justify-content:center;padding:12px;">
        <img id="inspectorImageEl" src="" alt="Preview" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;" />
      </div>
      <div id="inspectorCodeViewer" class="code-viewer-container" style="display:none;"></div>
      <textarea id="inspectorCodeBox" class="form-input selectable" readonly style="display:none;"></textarea>
      <div id="inspectorDiffContainer" class="diff-container" style="display:none;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="inspectorRevealBtn">Reveal in Explorer</button>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <button class="btn-secondary" id="inspectorRevertBtn" style="color:#FBBF24;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.08);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="margin-right:4px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Revert to Initial Version</button>
        <button class="btn-primary" onclick="closeInspectorModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toastBox"></div>

<script>
  let appState = {
    config: null,
    sessions: [],
    activeSessionId: '',
    activeWorkspaceDir: '',
    isBusy: false,
    statusText: 'Ready',
    busySessions: {},
    configFilePath: '%APPDATA%\\Metis\\config.json'
  };

  let editingVendorId = null;
  let showApiKeyPlain = false;

  function hostPost(payload) {
    if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
      window.__TAURI__.core.invoke('host_post', { payload: JSON.stringify(payload) }).catch(console.error);
    }
  }

  function switchToSession(sessionId) {
    if (!sessionId || sessionId === appState.activeSessionId) return;
    appState.activeSessionId = sessionId;
    appState.isBusy = !!(appState.busySessions && appState.busySessions[sessionId]);
    appState.statusText = (appState.busySessions && appState.busySessions[sessionId]) || 'Ready';
    renderAll();
  }

  // Receive state updates from Tauri Host
  if (window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('host_message', (event) => {
      const msg = typeof event.payload === 'string' ? JSON.parse(event.payload) : event.payload;
      handleHostMessage(msg);
    });
  }

  function updateAppVersionUI(ver) {
    if (!ver) return;
    const cleanVer = String(ver).trim().replace(/^v/i, '');
    const pill = document.getElementById('appVersionPill');
    if (pill && cleanVer) {
      pill.textContent = `v${cleanVer}`;
    }
  }

  /* ----------------------------------------------------
     Metis Dynamic Kawaii Mascot Engine
     - Mascot: Cartoon Cloud Cat M (Metis Blue Theme)
     - Expressions: Happy, Wink, Love, Focused, Sleepy, Shocked
     - Dynamic Periodic Mood Switch + Click Interaction
  ---------------------------------------------------- */
  const MASCOT_MOODS = ['happy', 'wink', 'love', 'focused', 'sleepy', 'shocked'];
  let currentMascotMood = 'happy';
  let mascotMoodTimer = null;

  function getMascotFaceSvg(mood) {
    const eyesColor = '#0c4a6e';
    const blushColor = '#fb7185';
    let eyesHtml = '';
    let mouthHtml = '';

    if (mood === 'happy') {
      eyesHtml = `
        <path d="M 205,258 Q 220,238 235,258" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round"/>
        <path d="M 277,258 Q 292,238 307,258" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round"/>
      `;
      mouthHtml = `<path d="M 242,284 Q 256,304 270,284" fill="${eyesColor}" stroke="${eyesColor}" stroke-width="3" stroke-linecap="round"/>`;
    } else if (mood === 'wink') {
      eyesHtml = `
        <circle cx="220" cy="252" r="10" fill="${eyesColor}"/>
        <circle cx="217" cy="249" r="3.5" fill="#ffffff"/>
        <path d="M 277,255 Q 292,238 307,255" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round"/>
      `;
      mouthHtml = `<path d="M 244,285 Q 256,296 268,285" fill="none" stroke="${eyesColor}" stroke-width="4.5" stroke-linecap="round"/>`;
    } else if (mood === 'love') {
      eyesHtml = `
        <path d="M 220,238 L 223,248 L 233,250 L 225,257 L 227,267 L 220,261 L 213,267 L 215,257 L 207,250 L 217,248 Z" fill="#f43f5e"/>
        <path d="M 292,238 L 295,248 L 305,250 L 297,257 L 299,267 L 292,261 L 285,267 L 287,257 L 279,250 L 289,248 Z" fill="#f43f5e"/>
      `;
      mouthHtml = `<path d="M 240,282 Q 256,306 272,282 Z" fill="#f43f5e"/>`;
    } else if (mood === 'focused') {
      eyesHtml = `
        <path d="M 206,244 L 226,254 L 206,264" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 306,244 L 286,254 L 306,264" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      `;
      mouthHtml = `<path d="M 246,288 Q 256,280 266,288" fill="none" stroke="${eyesColor}" stroke-width="4.5" stroke-linecap="round"/>`;
    } else if (mood === 'sleepy') {
      eyesHtml = `
        <path d="M 205,248 Q 220,266 235,248" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round"/>
        <path d="M 277,248 Q 292,266 307,248" fill="none" stroke="${eyesColor}" stroke-width="6" stroke-linecap="round"/>
        <circle cx="325" cy="230" r="6" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
        <circle cx="338" cy="216" r="9" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
      `;
      mouthHtml = `<circle cx="256" cy="286" r="3.5" fill="${eyesColor}"/>`;
    } else { // shocked
      eyesHtml = `
        <circle cx="220" cy="252" r="14" fill="${eyesColor}"/>
        <circle cx="216" cy="248" r="5" fill="#ffffff"/>
        <circle cx="292" cy="252" r="14" fill="${eyesColor}"/>
        <circle cx="288" cy="248" r="5" fill="#ffffff"/>
      `;
      mouthHtml = `<ellipse cx="256" cy="292" rx="7" ry="11" fill="${eyesColor}"/>`;
    }

    const blushHtml = `
      <g class="mascot-blush-glow">
        <ellipse cx="196" cy="272" rx="14" ry="8" fill="${blushColor}" opacity="0.75" />
        <ellipse cx="316" cy="272" rx="14" ry="8" fill="${blushColor}" opacity="0.75" />
      </g>
    `;

    return `
      <g class="mascot-face-group">
        ${eyesHtml}
        ${mouthHtml}
        ${blushHtml}
      </g>
    `;
  }

  function renderMascotSvg(mood = 'happy', size = 32, prefix = 'm') {
    const p = prefix;
    const faceHtml = getMascotFaceSvg(mood);
    return `<svg class="metis-mascot-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
    <defs>
      <linearGradient id="${p}-bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="50%" stop-color="#0284c7"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>

      <radialGradient id="${p}-bgGrad" cx="50%" cy="35%" r="80%">
        <stop offset="0%" stop-color="#111827"/>
        <stop offset="60%" stop-color="#080c16"/>
        <stop offset="100%" stop-color="#03050a"/>
      </radialGradient>

      <filter id="${p}-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(56, 189, 248, 0.45)"/>
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
      </filter>
    </defs>

    <rect width="512" height="512" rx="128" fill="url(#${p}-bgGrad)" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="3" y="3" width="506" height="506" rx="125" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>

    <g class="mascot-sparkle" opacity="0.9">
      <path d="M 88,140 Q 98,140 98,130 Q 98,140 108,140 Q 98,140 98,150 Q 98,140 88,140 Z" fill="#38bdf8" />
      <path d="M 405,115 Q 417,115 417,103 Q 417,115 429,115 Q 417,115 405,115 Z" fill="#38bdf8" />
      <circle cx="430" cy="155" r="4" fill="#ffffff" opacity="0.8"/>
      <circle cx="80" cy="180" r="3" fill="#ffffff" opacity="0.8"/>
    </g>

    <g class="mascot-gentle-float">
      <path d="
        M 125,360 
        C 105,320 100,210 135,160 
        L 175,115 
        C 195,145 220,200 256,225 
        C 292,200 317,145 337,115 
        L 377,160 
        C 412,210 407,320 387,360 
        C 355,400 305,370 256,370 
        C 207,370 157,400 125,360 Z
      " fill="url(#${p}-bodyGrad)" filter="url(#${p}-shadow)"/>

      <polygon points="148,168 174,136 182,174" fill="#fb7185" opacity="0.65"/>
      <polygon points="364,168 338,136 330,174" fill="#fb7185" opacity="0.65"/>

      <path d="M 190,340 C 200,300 220,285 256,285 C 292,285 312,300 322,340 C 285,360 227,360 190,340 Z" fill="#f0f9ff" opacity="0.95"/>

      <ellipse cx="170" cy="365" rx="14" ry="10" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="342" cy="365" rx="14" ry="10" fill="#ffffff" opacity="0.9"/>

      <g class="mascot-face-container">
        ${faceHtml}
      </g>
    </g>
  </svg>`;
  }

  function setMascotMood(mood, animate = true) {
    if (!MASCOT_MOODS.includes(mood)) mood = 'happy';
    currentMascotMood = mood;

    const targets = [
      { el: document.getElementById('titlebarMascot') || document.querySelector('.titlebar-logo-icon'), size: 18, prefix: 'tb' },
      { el: document.getElementById('brandMascot') || document.querySelector('.brand-logo'), size: 32, prefix: 'brand' },
      { el: document.getElementById('emptyHeroMascot') || document.querySelector('.empty-hero-mascot'), size: 68, prefix: 'hero' }
    ];

    const moodName = mood.charAt(0).toUpperCase() + mood.slice(1);
    targets.forEach(({ el, size, prefix }) => {
      if (!el) return;
      el.innerHTML = renderMascotSvg(mood, size, prefix);
      el.title = `Metis Mascot (${moodName}) - click to change mood!`;
      if (animate) {
        el.classList.remove('mascot-squish');
        void el.offsetWidth;
        el.classList.add('mascot-squish');
      }
    });
  }

  function triggerRandomMascotMood() {
    const otherMoods = MASCOT_MOODS.filter(m => m !== currentMascotMood);
    const nextMood = otherMoods[Math.floor(Math.random() * otherMoods.length)];
    setMascotMood(nextMood, true);
    resetMascotMoodTimer();
  }

  function resetMascotMoodTimer() {
    if (mascotMoodTimer) clearTimeout(mascotMoodTimer);
    const delay = Math.floor(Math.random() * 6000) + 12000; // 12s - 18s
    mascotMoodTimer = setTimeout(() => {
      triggerRandomMascotMood();
    }, delay);
  }

  function initMetisMascot() {
    setMascotMood('happy', false);
    resetMascotMoodTimer();

    document.addEventListener('click', (e) => {
      const mascot = e.target && e.target.closest ? e.target.closest('#titlebarMascot, #brandMascot, .empty-hero-mascot') : null;
      if (mascot) {
        triggerRandomMascotMood();
      }
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    initMetisMascot();
    if (window.__METIS_VERSION__) {
      updateAppVersionUI(window.__METIS_VERSION__);
    } else if (window.__TAURI__ && window.__TAURI__.app && window.__TAURI__.app.getVersion) {
      window.__TAURI__.app.getVersion().then(updateAppVersionUI).catch(() => {});
    }
    setTimeout(() => {
      hostPost({ action: 'uiReady' });
    }, 80);
  });


  function handleHostMessage(msg) {
    if (!msg || !msg.type) return;

    if (msg.type === 'fullState') {
      if (msg.appVersion) {
        updateAppVersionUI(msg.appVersion);
      }
      appState.config = msg.config;
      if (appState.config && appState.config.Theme) {
        applyTheme(appState.config.Theme);
      }
      if (typeof msg.isMaximized === 'boolean') {
        updateWindowStateUI(msg.isMaximized);
      }
      appState.sessions = msg.sessions || [];
      appState.activeSessionId = msg.activeSessionId;
      appState.activeWorkspaceDir = msg.activeWorkspaceDir || '';

      if (msg.busySessionIds && Array.isArray(msg.busySessionIds)) {
        if (!appState.busySessions) appState.busySessions = {};
        const newBusy = {};
        msg.busySessionIds.forEach(id => {
          if (id === msg.activeSessionId && msg.statusText) {
            newBusy[id] = msg.statusText;
          } else {
            newBusy[id] = (appState.busySessions && appState.busySessions[id]) || 'Running...';
          }
        });
        appState.busySessions = newBusy;
      }
      appState.isBusy = !!(appState.busySessions && appState.busySessions[appState.activeSessionId]);
      appState.statusText = (msg.activeSessionId === appState.activeSessionId && msg.statusText) || (appState.busySessions && appState.busySessions[appState.activeSessionId]) || 'Ready';
      if (msg.configFilePath) appState.configFilePath = msg.configFilePath;

      if (!editingVendorId && appState.config) {
        editingVendorId = appState.config.ActiveVendorId;
      }

      if (appState.config && appState.config.ThinkingIntensity) {
        let val = appState.config.ThinkingIntensity;
        if (val === 'off') val = 'medium';
        currentThinkingIntensity = val;
        updateThinkingGlider(currentThinkingIntensity);
      }

      renderAll();
      if (msg.toast) showToast(msg.toast);
      if (msg.prefillPrompt) {
        const box = document.getElementById('promptInput');
        box.value = msg.prefillPrompt;
        box.focus();
      }
    } else if (msg.type === 'windowState') {
      updateWindowStateUI(!!msg.isMaximized);
    } else if (msg.type === 'busyStatus') {
      const sid = msg.sessionId || appState.activeSessionId;
      if (!appState.busySessions) appState.busySessions = {};
      if (msg.isBusy) {
        appState.busySessions[sid] = msg.statusText || 'Running...';
      } else {
        delete appState.busySessions[sid];
      }
      if (sid === appState.activeSessionId) {
        appState.isBusy = !!msg.isBusy;
        appState.statusText = msg.statusText || 'Ready';
        renderBusyBar();
      }
      renderSessionList();
    } else if (msg.type === 'streamUpdate') {
      const sid = msg.sessionId || appState.activeSessionId;
      const targetSess = (appState.sessions || []).find(x => x.Id === sid);
      if (targetSess && targetSess.UiEvents) {
        const ev = targetSess.UiEvents.find(x => x.Id === msg.eventId);
        if (ev) {
          ev.Content = msg.content || '';
        }
      }
      if (sid === appState.activeSessionId) {
        const domEl = document.getElementById('ev-body-' + msg.eventId);
        if (domEl) {
          const newHtml = formatSimpleMarkdown(msg.content || '');
          if (domEl.innerHTML !== newHtml) {
            domEl.innerHTML = newHtml;
            const container = document.getElementById('chatStreamContainer');
            if (container) container.scrollTop = container.scrollHeight;
          }
        } else {
          renderChatStream();
        }
      }
    } else if (msg.type === 'fileContentPreview') {
      openInspectorWithData(msg);
    } else if (msg.type === 'toast') {
      showToast(msg.text);
    } else if (msg.type === 'ollamaModels') {
      if (appState.config) {
        const v = appState.config.Vendors.find(x => x.Id === editingVendorId || x.Id === 'openai_compatible' || x.Id === 'ollama');
        if (v && msg.models && msg.models.length > 0) {
          v.PresetModels = msg.models.slice(0, 4);
          v.SelectedModel = msg.models[0];
          saveSettingsSilent();
          renderSettingsPane();
          renderSidebarFooter();
        }
      }
      if (msg.toast) showToast(msg.toast);
    }
  }

  function getActiveSession() {
    if (!appState.sessions || appState.sessions.length === 0) return null;
    return appState.sessions.find(s => s.Id === appState.activeSessionId) || appState.sessions[0];
  }

  function getActiveVendor() {
    if (!appState.config || !appState.config.Vendors) return null;
    return appState.config.Vendors.find(v => v.Id === appState.config.ActiveVendorId) || appState.config.Vendors[0];
  }

  function renderAll() {
    const active = getActiveSession();
    updateTitlebarSession(active ? active.Title : 'Chat');
    renderSidebarFooter();
    renderSessionList();
    renderWorkspaceHeader();
    renderWhitelistStrip();
    renderChatStream();
    renderBusyBar();
  }

  function renderSidebarFooter() {
    const v = getActiveVendor();
    if (!v) return;
    const vendorEl = document.getElementById('footerVendorName');
    if (vendorEl) vendorEl.textContent = v.DisplayName;
    const modelEl = document.getElementById('footerModelName');
    if (modelEl) modelEl.textContent = v.SelectedModel || '(No model selected)';
    const dot = document.getElementById('footerProviderDot');
    if (dot) {
      const hasKeyOrFree = (v.Type === 4 || v.Type === 6 || (v.ApiKey && v.ApiKey.trim().length > 0) || (v.BaseUrl && v.BaseUrl.includes('11434')));
      dot.className = hasKeyOrFree ? 'provider-dot' : 'provider-dot warn';
    }
  }

  function renderSessionList() {
    const container = document.getElementById('sessionListContainer');
    const query = (document.getElementById('sessionSearchInput').value || '').trim().toLowerCase();
    
    // Only display non-empty historical sessions in sidebar
    const historySessions = (appState.sessions || []).filter(s => !isSessionEmpty(s));
    const list = historySessions.filter(s => !query || (s.Title || '').toLowerCase().includes(query));

    document.getElementById('sessionCountBadge').textContent = String(historySessions.length);
    container.innerHTML = '';

    if (list.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.style.padding = '24px 16px';
      emptyDiv.style.textAlign = 'center';
      emptyDiv.style.fontSize = '12px';
      emptyDiv.style.color = 'var(--text-muted)';
      emptyDiv.style.lineHeight = '1.6';
      emptyDiv.innerHTML = query 
        ? 'No chats found matching your search.'
        : '<div style="opacity:0.6;margin-bottom:4px;">No past chats</div><div>Chat history will appear here.</div>';
      container.appendChild(emptyDiv);
      return;
    }

    list.forEach(s => {
      const isGenerating = !!(appState.busySessions && appState.busySessions[s.Id]);
      const div = document.createElement('div');
      div.className = 'session-item' + (s.Id === appState.activeSessionId ? ' active' : '');
      div.onclick = () => {
        if (s.Id !== appState.activeSessionId) {
          switchToSession(s.Id);
          hostPost({ action: 'selectSession', sessionId: s.Id });
        }
      };

      div.innerHTML = `
        <div class="session-info">
          <div class="session-title">${escapeHtml(s.Title || 'Untitled Chat')}</div>
        </div>
        ${isGenerating ? '<span class="session-busy-dot" title="Generating response..."></span>' : ''}
        <div class="session-item-actions" onclick="event.stopPropagation()">
          <button class="icon-btn-sm" title="Rename" onclick="renameSession('${s.Id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <button class="icon-btn-sm danger" title="Delete chat" onclick="deleteSession('${s.Id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function renderWorkspaceHeader() {
    const sess = getActiveSession();
    if (!sess) return;
    const titleEl = document.getElementById('currentSessionTitle');
    if (titleEl) titleEl.textContent = sess.Title || 'Default Chat';
  }

  function formatFileSize(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) {
      size /= 1024;
      i++;
    }
    return (i === 0 ? size : size.toFixed(1)) + ' ' + units[i];
  }

  function renderWhitelistStrip() {
    const container = document.getElementById('whitelistStripContainer');
    const sess = getActiveSession();
    const dirs = sess ? (sess.AllowedDirectories || []) : [];
    const files = sess ? (sess.Whitelist || []) : [];

    if (dirs.length === 0 && files.length === 0) {
      container.style.display = 'none';
      container.innerHTML = '';
      return;
    }
    container.style.display = 'flex';

    let dirRowsHtml = dirs.map(d => {
      const safeDir = escapeJsStr(d);
      const folderName = d.split(/[\\/]/).filter(Boolean).pop() || d;
      return `
        <div class="file-list-row is-dir" title="${escapeHtml(d)}">
          <div class="file-list-row-left">
            <div class="file-list-row-icon" style="color:#818CF8;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="file-list-row-name" style="color:#C7D2FE;">${escapeHtml(folderName)}</span>
            <span class="badge-row-status badge-dir">DIR</span>
            <span class="file-list-row-path" title="${escapeHtml(d)}">${escapeHtml(d)}</span>
          </div>
          <div class="file-list-row-actions">
            <button class="btn-row-action" title="Reveal in Explorer" onclick="hostPost({ action: 'revealFile', path: '${safeDir}' })">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              <span>Reveal</span>
            </button>
            <button class="icon-btn-sm danger" style="width:20px;height:20px;padding:0;" title="Unlink directory" onclick="hostPost({ action: 'removeDirectory', path: '${safeDir}' })">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');

    let fileRowsHtml = files.map(f => {
      const mediaKind = (f.MediaKind || 'code').toLowerCase();
      const isPdf = mediaKind === 'pdf';
      const isImage = mediaKind === 'image';
      const isBinaryMedia = isPdf || isImage || !!f.IsBinaryMedia;
      const isModified = (f.EditCount > 0);

      let badgeHtml = '';
      let iconColor = isModified ? '#34D399' : '#9CA3AF';
      let rowClass = 'file-list-row';
      if (isModified) rowClass += ' modified';
      if (isPdf) rowClass += ' is-pdf';
      if (isImage) rowClass += ' is-img';

      let iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

      if (isPdf) {
        badgeHtml = '<span class="badge-row-status badge-pdf">PDF</span>';
        iconColor = '#FBBF24';
        iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';

        badgeHtml = `<span class="badge-row-status badge-mod">MOD +${f.EditCount}</span>`;

      const displayName = f.FileName || f.RelativePath;
      const parentDir = f.RelativePath && f.RelativePath.includes('/') ? f.RelativePath.substring(0, f.RelativePath.lastIndexOf('/')) : (f.RelativePath && f.RelativePath.includes('\\') ? f.RelativePath.substring(0, f.RelativePath.lastIndexOf('\\')) : '');
      const safePath = escapeJsStr(f.FullPath);
      const sizeFormatted = formatFileSize(f.CurrentSizeBytes || 0);

      return `
        <div class="${rowClass}" title="${escapeHtml(f.FullPath)}">
          <div class="file-list-row-left">
            <div class="file-list-row-icon" style="color:${iconColor};">
              ${iconSvg}
            </div>
            <span class="file-list-row-name">${escapeHtml(displayName)}</span>
            ${badgeHtml}
            <span class="file-list-row-meta">${sizeFormatted}</span>
            ${parentDir ? `<span class="file-list-row-path" title="${escapeHtml(f.RelativePath)}">${escapeHtml(parentDir)}/</span>` : ''}
          </div>
          <div class="file-list-row-actions">
            <button class="btn-row-action" title="Inspect file content" onclick="hostPost({ action: 'inspectFile', path: '${safePath}' })">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>Inspect</span>
            </button>
            ${!isBinaryMedia ? `
            <button class="btn-row-action btn-revert" title="Revert to initial version (回滚到初始状态)" onclick="hostPost({ action: 'revertFile', path: '${safePath}' })">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              <span>Revert</span>
            </button>` : ''}
            <button class="icon-btn-sm danger" style="width:20px;height:20px;padding:0;" title="Remove from workspace" onclick="hostPost({ action: 'removeFile', path: '${safePath}' })">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

    const totalCount = files.length + dirs.length;
    const countText = `${files.length} ${files.length === 1 ? 'file' : 'files'}${dirs.length > 0 ? ', ' + dirs.length + (dirs.length === 1 ? ' folder' : ' folders') : ''}`;

    container.innerHTML = `
      <div class="whitelist-header-row">
        <div class="whitelist-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Workspace Files</span>
          <span class="whitelist-count-badge">${countText}</span>
        </div>
        <div style="display:flex;gap:6px;">
          ${dirs.length > 0 ? '<button class="btn-secondary" style="padding:2px 8px;font-size:11px;" onclick="hostPost({ action: \'refreshWorkspace\' })">Refresh</button>' : ''}
          <button class="btn-secondary" style="padding:2px 8px;font-size:11px;color:#F87171;" onclick="hostPost({ action: 'clearWhitelist' })">Clear</button>

      <div class="whitelist-list">${dirRowsHtml}${fileRowsHtml}</div>

  let lastRenderedSessionId = null;
  let previouslyRenderedEventIds = new Set();

  function renderChatStream() {
    const container = document.getElementById('chatStreamContainer');
    const sess = getActiveSession();
    const events = sess ? (sess.UiEvents || []) : [];
    const currentSessionId = sess ? sess.Id : null;

    if (events.length === 0) {
      lastRenderedSessionId = currentSessionId;
      previouslyRenderedEventIds.clear();
      container.innerHTML = `
        <div class="empty-hero" style="margin: 100px auto 20px auto; text-align: center; display: flex; flex-direction: column; align-items: center;">
          <div class="empty-hero-mascot" id="emptyHeroMascot" style="margin-bottom: 14px;" title="Metis Mascot - click to change mood!">
            ${renderMascotSvg(currentMascotMood, 68, 'hero')}
          </div>
          <div style="font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 6px;">Metis</div>
          <p style="color: var(--text-muted); font-size: 13px; margin: 0;">How can I help you today?</p>
        </div>
      `;
      return;
    }

    const isSessionSwitch = (lastRenderedSessionId !== currentSessionId);
    lastRenderedSessionId = currentSessionId;

    const newRenderedIds = new Set();
    const htmlChunks = [];
    let newItemsCount = 0;

    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      const evId = ev.Id || ('ev-' + i);
      newRenderedIds.add(evId);

      const isNew = ev.Type !== 'user' && (isSessionSwitch || !previouslyRenderedEventIds.has(evId));
      let animStyle = '';
      if (isNew) {
        const staggerDelay = (isSessionSwitch ? Math.min(i, 8) * 0.045 : Math.min(newItemsCount++, 3) * 0.06);
        animStyle = `style="animation-delay: ${staggerDelay}s;"`;
      }

      htmlChunks.push(renderSingleEvent(ev, isNew, animStyle, evId));
    }

    previouslyRenderedEventIds = newRenderedIds;
    container.innerHTML = htmlChunks.join('');
    container.scrollTop = container.scrollHeight;

    // Clean up GPU will-change, filter and class after text mist emerge finishes to ensure crisp typography
    container.querySelectorAll('.text-mist-emerge').forEach(el => {
      el.addEventListener('animationend', () => {
        el.style.filter = 'none';
        el.style.transform = 'none';
        el.style.willChange = 'auto';
        el.classList.remove('text-mist-emerge');
      }, { once: true });
    });
  }

  function renderSingleEvent(ev, isNew = false, animStyle = '', evId = '') {
    if (!evId) evId = ev.Id || '';
    if (ev.Type === 'user') {
      return `
        <div class="msg-row user-row" id="msg-row-${evId}">
          <div class="msg-user"><div class="msg-user-text">${escapeHtml((ev.Content || '').trim())}</div></div>
          <div class="msg-user-meta">
            <button class="btn-msg-copy" title="Copy prompt" onclick="copyEventRawContent(this, '${evId}')">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copy</span>
            </button>
            <span>${escapeHtml(ev.Timestamp || '')}</span>
          </div>
        </div>
      `;
    }
    if (ev.Type === 'assistant') {
      const formatted = formatSimpleMarkdown(ev.Content || '');
      if (!formatted) return '';
      return `
        <div class="msg-row assistant-row" id="msg-row-${evId}">
          <div class="msg-assistant">
            <div class="msg-body ${isNew ? 'text-mist-emerge' : ''}" ${animStyle} id="ev-body-${evId}">${formatted}</div>
            <div class="msg-assistant-footer">
              <button class="btn-msg-copy" title="Copy response" onclick="copyEventRawContent(this, '${evId}')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Copy</span>
              </button>
              ${ev.Timestamp ? `<span style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">${escapeHtml(ev.Timestamp)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }
    if (ev.Type === 'file_edit') {
      return `
        <div class="msg-row" id="msg-row-${evId}">
          <div class="event-file-edit">
            <div class="event-file-left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
              <span class="${isNew ? 'text-mist-emerge' : ''}" ${animStyle}>${escapeHtml(ev.Content || 'Modified files')}</span>
            </div>
            <button class="btn-secondary emerald" style="padding:3px 9px;font-size:11.5px;" onclick="openDiffInspector('${evId}')">Inspect Code</button>
          </div>
        </div>
      `;
    }
    if (ev.Type === 'verify_result') {
      const isRunning = !!ev.IsRunning;
      const cmdRaw = ev.Command || (ev.Content || '').replace(/^(?:Executing|Executed)\s*`?/, '').replace(/`?\s*\.{0,3}$/, '') || 'command';
      const cmdText = escapeHtml(cmdRaw);
      const statusClass = isRunning ? 'running' : (ev.Succeeded ? 'pass' : 'fail');
      const termOutput = (ev.TerminalOutput || '').trim();
      const hasOutput = !isRunning && termOutput.length > 0;
      const autoExpand = !isRunning && !ev.Succeeded && hasOutput;
      return `
        <div class="msg-row" id="msg-row-${evId}">
          <div class="cmd-status-card ${statusClass}" style="flex-direction:column;align-items:stretch;width:100%;max-width:100%;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:${hasOutput ? 'pointer' : 'default'};" ${hasOutput ? `onclick="toggleTerminalOutput('${evId}')"` : ''}>
              <div class="cmd-status-left">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="cmd-status-icon ${isRunning ? 'pulse' : ''}">
                  <polyline points="4 17 10 11 4 5"/>
                  <line x1="12" y1="19" x2="20" y2="19"/>
                </svg>
                <span class="cmd-status-text ${isNew ? 'text-mist-emerge' : ''}" ${animStyle}>
                  ${isRunning ? 'Executing' : 'Executed'} <code class="cmd-status-code">${cmdText}</code>${isRunning ? '...' : ''}
                </span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                ${!isRunning && !ev.Succeeded ? '<span class="cmd-status-badge fail">Failed</span>' : ''}
                ${!isRunning && ev.Succeeded && hasOutput ? '<span class="cmd-status-badge" style="background:rgba(16,185,129,0.12);color:var(--accent-emerald,#10B981);">Passed</span>' : ''}
                ${hasOutput ? `
                  <button class="icon-btn-sm" title="Toggle Terminal Output" onclick="event.stopPropagation();toggleTerminalOutput('${evId}')">
                    <svg id="term-chevron-${evId}" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform 0.2s;${autoExpand ? 'transform:rotate(180deg);' : ''}"><polyline points="6 9 12 15 18 9"/></svg>
                  </button>
                  <button class="icon-btn-sm" title="Copy Output" onclick="event.stopPropagation();copyTerminalOutput(this, '${evId}')">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  </button>
                ` : ''}
              </div>
            </div>
            ${hasOutput ? `
              <div id="term-body-${evId}" class="terminal-body" style="display:${autoExpand ? 'block' : 'none'};margin-top:8px;border-top:1px solid var(--border-subtle);background:#07090E;border-radius:6px;padding:8px 12px;max-height:260px;overflow-y:auto;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:#D1D5DB;white-space:pre-wrap;word-break:break-all;">${escapeHtml(termOutput)}</div>
            ` : ''}
          </div>
        </div>
      `;
    }
    if (ev.Type === 'search_result') {
      const results = ev.SearchResults || [];
      const count = results.length;
      const countText = count > 0 ? `Retrieved ${count} web results` : 'No web results found';
      return `
        <div class="msg-row" id="msg-row-${evId}">
          <div class="search-summary-card">
            <div class="search-summary-left">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.2" style="flex-shrink:0;">
                <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span class="search-summary-title">Web Search:</span>
              <span class="search-summary-query ${isNew ? 'text-mist-emerge' : ''}" ${animStyle}>"${escapeHtml(ev.SearchQuery || '')}"</span>
            </div>
            <span class="search-summary-badge">${countText}</span>
          </div>
        </div>
      `;
    }
    if (ev.Type === 'loop_success') {
      return '';
    }
    if (ev.Type === 'security_block') {
      return `
        <div class="msg-row" id="msg-row-${evId}">
          <div class="event-security"><span class="${isNew ? 'text-mist-emerge' : ''}" ${animStyle}>${escapeHtml(ev.Content)}</span></div>
        </div>
      `;
    }
    return `
      <div class="msg-row" id="msg-row-${evId}">
        <div class="event-notice"><span class="${isNew ? 'text-mist-emerge' : ''}" ${animStyle}>${escapeHtml(ev.Content)}</span></div>
      </div>
    `;
  }

  function renderBusyBar() {
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');

    if (sendBtn) sendBtn.disabled = appState.isBusy;
    if (stopBtn) stopBtn.style.display = appState.isBusy ? 'inline-flex' : 'none';
  }

  function stopCurrentLoop() {
    const sid = appState.activeSessionId;
    if (appState.busySessions) {
      delete appState.busySessions[sid];
    }
    appState.isBusy = false;
    appState.statusText = 'Ready';
    renderBusyBar();
    renderSessionList();
    hostPost({ action: 'stopLoop', sessionId: sid });
  }

  function togglePause() {
    const isPaused = ((appState.statusText || '').toLowerCase().includes('paused'));
    const sid = appState.activeSessionId;
    if (isPaused) {
      hostPost({ action: 'resumeLoop', sessionId: sid });
    } else {
      hostPost({ action: 'pauseLoop', sessionId: sid });
    }
  }

  function isSessionGenerating(sessionId) {
    return !!(appState.busySessions && appState.busySessions[sessionId]);
  }

  function isSessionEmpty(s) {
    if (!s) return true;
    if (isSessionGenerating(s.Id)) return false;
    const msgCount = (s.UiEvents || []).length;
    const historyCount = (s.ApiHistory || []).length;
    return msgCount === 0 && historyCount === 0;
  }

  // Chat Actions
  function createNewSession() {
    const current = getActiveSession();
    if (current && isSessionEmpty(current)) {
      showToast('Already in an empty chat.');
      return;
    }
    const existingEmpty = (appState.sessions || []).find(s => isSessionEmpty(s));
    if (existingEmpty) {
      switchToSession(existingEmpty.Id);
      hostPost({ action: 'selectSession', sessionId: existingEmpty.Id });
      showToast('Switched to empty chat.');
      return;
    }
    hostPost({ action: 'createSession' });
  }

  function renameSession(sessionId) {
    const s = (appState.sessions || []).find(x => x.Id === sessionId);
    if (!s) return;
    const newTitle = prompt('Enter new chat name:', s.Title || '');
    if (newTitle !== null && newTitle.trim().length > 0) {
      hostPost({ action: 'renameSession', sessionId: sessionId, title: newTitle.trim() });
    }
  }

  function promptRenameActiveSession() {
    const s = getActiveSession();
    if (s) renameSession(s.Id);
  }

  function deleteSession(sessionId) {
    if (appState.busySessions) {
      delete appState.busySessions[sessionId];
    }
    hostPost({ action: 'deleteSession', sessionId: sessionId });
  }

  // Send Prompt & Clipboard Paste (Images / Files)
  function handleComposerKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  }

  function triggerMediaPicker() {
    if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
      hostPost({ action: 'pickMedia' });
    } else {
      const input = document.getElementById('mediaFileInput');
      if (input) input.click();
    }
  }

  function handleMediaFileInput(inputEl) {
    if (!inputEl || !inputEl.files || inputEl.files.length === 0) return;
    const files = Array.from(inputEl.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const dataUrl = evt.target.result || '';
        hostPost({
          action: 'addMediaBlob',
          fileName: file.name,
          mimeType: file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/png'),
          base64: dataUrl,
        });
      };
      reader.readAsDataURL(file);
    });
    inputEl.value = '';
  }

  function handleComposerPaste(e) {
    if (!e.clipboardData) return;

    // 1. Check if clipboard contains image or PDF blobs (e.g., screenshot via Win+Shift+S / PrintScreen)
    if (e.clipboardData.items) {
      for (let i = 0; i < e.clipboardData.items.length; i++) {
        const item = e.clipboardData.items[i];
        if (item.kind === 'file' && item.type && (item.type.startsWith('image/') || item.type === 'application/pdf')) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (blob) {
            const reader = new FileReader();
            reader.onload = function(evt) {
              const dataUrl = evt.target.result || '';
              hostPost({
                action: 'pasteImage',
                fileName: blob.name || '',
                base64: dataUrl,
                mimeType: item.type || 'image/png'
              });
            };
            reader.readAsDataURL(blob);
          }
          return;
        }
      }
    }
  }

  function sendPrompt() {
    if (appState.isBusy) return;
    const input = document.getElementById('promptInput');
    const text = (input.value || '').trim();
    if (!text) return;
    const activeId = appState.activeSessionId;
    input.value = '';
    if (!appState.busySessions) appState.busySessions = {};
    appState.busySessions[activeId] = 'Thinking...';
    appState.isBusy = true;
    appState.statusText = 'Thinking...';
    renderBusyBar();
    renderSessionList();
    hostPost({ action: 'sendPrompt', prompt: text, sessionId: activeId });
  }

  // Thinking Intensity Slider Logic
  let currentThinkingIntensity = 'medium';

  function updateThinkingGlider(val) {
    if (!val || val === 'off') val = 'medium';
    currentThinkingIntensity = val;
    const track = document.getElementById('thinkingSliderTrack');
    const glider = document.getElementById('thinkingGlider');
    if (!track || !glider) return;

    const btns = track.querySelectorAll('.thinking-seg-btn');
    let activeBtn = null;
    btns.forEach(btn => {
      if (btn.getAttribute('data-val') === currentThinkingIntensity) {
        btn.classList.add('active');
        activeBtn = btn;
      } else {
        btn.classList.remove('active');
      }
    });

    if (activeBtn) {
      const trackRect = track.getBoundingClientRect();
      const btnRect = activeBtn.getBoundingClientRect();
      if (trackRect.width > 0 && btnRect.width > 0) {
        const leftOffset = btnRect.left - trackRect.left - 2;
        glider.style.width = btnRect.width + 'px';
        glider.style.transform = 'translateX(' + leftOffset + 'px)';
      }
      if (currentThinkingIntensity === 'high') {
        glider.style.background = '#8B5CF6';
      } else if (currentThinkingIntensity === 'low') {
        glider.style.background = '#0EA5E9';
      } else {
        glider.style.background = 'var(--accent-color, #3B82F6)';
      }
    }
  }

  function setThinkingIntensity(val) {
    if (!val || val === 'off') val = 'medium';
    currentThinkingIntensity = val;
    updateThinkingGlider(val);
    try {
      localStorage.setItem('metis_thinking_intensity', val); localStorage.setItem('pinpoint_thinking_intensity', val);
    } catch(e) {}
    hostPost({ action: 'setThinkingIntensity', intensity: val });
  }

  window.addEventListener('resize', () => {
    updateThinkingGlider(currentThinkingIntensity);
  });

  // Settings Modal
  function openSettingsModal() {
    if (!appState.config) return;
    if (!editingVendorId) {
      editingVendorId = appState.config.ActiveVendorId || (appState.config.Vendors && appState.config.Vendors[0] ? appState.config.Vendors[0].Id : 'appearance');
    }
    const hint = document.getElementById('configPathHint');
    if (hint) {
      hint.textContent = 'Local storage path: ' + (appState.configFilePath || '%APPDATA%\\Metis\\config.json');
    }
    renderSettingsRail();
    renderSettingsPane();
    document.getElementById('settingsModal').classList.add('open');
  }

  function closeSettingsModal() {
    saveSettingsSilent();
    document.getElementById('settingsModal').classList.remove('open');
  }

  function renderSettingsRail() {
    const rail = document.getElementById('settingsVendorRail');
    if (!appState.config || !appState.config.Vendors) return;

    let html = `<div class="settings-rail-section-title">AI Providers</div>`;

    html += appState.config.Vendors.map(v => {
      const isSelected = v.Id === editingVendorId;
      const isActive = v.Id === appState.config.ActiveVendorId;
      const hasKey = (v.Type === 4 || (v.ApiKey && v.ApiKey.trim().length > 0));
      return `
        <div class="vendor-tab${isSelected ? ' selected' : ''}" onclick="selectEditingVendor('${v.Id}')">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span style="width:7px;height:7px;border-radius:50%;background:${hasKey ? '#0EA5E9' : '#6B7280'};flex-shrink:0;"></span>
            <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(v.DisplayName)}</span>
          </div>
          ${isActive ? '<span style="font-size:10px;color:#38BDF8;background:rgba(14,165,233,0.15);padding:1px 5px;border-radius:4px;flex-shrink:0;">Active</span>' : ''}
        </div>
      `;
    }).join('');

    html += `<div class="settings-rail-section-title">Application</div>`;

    const isAppearanceSelected = (editingVendorId === 'appearance');

  function highlightCodeLine(raw) {
    if (!raw && raw !== '') return '&nbsp;';
    if (raw === '') return '&nbsp;';

    const tokenRegex = /(#.*$|\/\/.*$|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|\b(?:def|class|return|if|elif|else|for|while|try|except|finally|with|as|import|from|in|is|not|and|or|lambda|yield|async|await|fn|let|const|var|function|new|this|throw|switch|case|break|continue|default|typeof|instanceof|interface|type|struct|impl|pub|mut|use|mod|crate|enum|self|True|False|None|true|false|null|undefined|nil)\b|\b(?:int|float|str|bool|list|dict|set|tuple|cls|console|window|document|Promise|Array|Object|String|Number|Boolean|Option|Result|Some|Ok|Err|Vec)\b|\b[a-zA-Z_$][a-zA-Z0-9_$]*(?=\s*\())/g;

    const keywords = new Set(['def','class','return','if','elif','else','for','while','try','except','finally','with','as','import','from','in','is','not','and','or','lambda','yield','async','await','fn','let','const','var','function','new','this','throw','switch','case','break','continue','default','typeof','instanceof','interface','type','struct','impl','pub','mut','use','mod','crate','enum','self','True','False','None','true','false','null','undefined','nil']);
    const types = new Set(['int','float','str','bool','list','dict','set','tuple','cls','console','window','document','Promise','Array','Object','String','Number','Boolean','Option','Result','Some','Ok','Err','Vec']);

    let result = '';
    let lastIndex = 0;
    let match;

    while ((match = tokenRegex.exec(raw)) !== null) {
      if (match.index > lastIndex) {
        result += escapeHtml(raw.slice(lastIndex, match.index));
      }
      const val = match[0];
      const esc = escapeHtml(val);
      if (val.startsWith('#') || val.startsWith('//') || val.startsWith('/*')) {
        result += `<span class="syn-comment">${esc}</span>`;
      } else if (val.startsWith('"') || val.startsWith("'") || val.startsWith('`')) {
        result += `<span class="syn-string">${esc}</span>`;
      } else if (/^\d/.test(val)) {
        result += `<span class="syn-number">${esc}</span>`;
      } else if (keywords.has(val)) {
        result += `<span class="syn-keyword">${esc}</span>`;
      } else if (types.has(val)) {
        result += `<span class="syn-type">${esc}</span>`;
      } else {
        result += `<span class="syn-func">${esc}</span>`;
      }
      lastIndex = tokenRegex.lastIndex;
    }
    if (lastIndex < raw.length) {
      result += escapeHtml(raw.slice(lastIndex));
    }
    return result || '&nbsp;';
  }

  // Inspector Modal
  function openInspectorWithData(data) {
    const mediaKind = (data.mediaKind || 'code').toLowerCase();
    const isImage = mediaKind === 'image';
    const isPdf = mediaKind === 'pdf';
    const isBinary = !!data.isBinaryMedia || isImage || isPdf;

    const statsChips = document.getElementById('inspectorStatsChips');
    if (statsChips) statsChips.innerHTML = '';

    if (isImage) {
      document.getElementById('inspectorTitle').textContent = 'Vision Image Preview — ' + (data.fileName || '');
      document.getElementById('inspectorMeta').textContent = `Full path: ${data.fullPath}  |  MIME: ${data.mimeType || 'image/*'}`;
      if (statsChips) statsChips.innerHTML = '<span class="diff-stat-chip neutral">IMG</span>';
    } else if (isPdf) {
      document.getElementById('inspectorTitle').textContent = 'PDF Document Preview — ' + (data.fileName || '');
      document.getElementById('inspectorMeta').textContent = `Full path: ${data.fullPath}  |  Multimodal Base64`;
      if (statsChips) statsChips.innerHTML = '<span class="diff-stat-chip neutral">PDF</span>';
    } else {
      document.getElementById('inspectorTitle').textContent = 'Live File Preview — ' + (data.fileName || '');
      document.getElementById('inspectorMeta').textContent = `Full path: ${data.fullPath}`;
      if (statsChips) {
        statsChips.innerHTML = `
          <span class="diff-stat-chip neutral">${formatFileSize(data.sizeBytes || (data.content || '').length)}</span>
          ${data.editCount > 0 ? `<span class="diff-stat-chip add">Modified ${data.editCount}x</span>` : ''}
        `;
      }
    }

    const imgContainer = document.getElementById('inspectorImageContainer');
    const imgEl = document.getElementById('inspectorImageEl');
    const codeBox = document.getElementById('inspectorCodeBox');
    const codeViewer = document.getElementById('inspectorCodeViewer');
    const diffContainer = document.getElementById('inspectorDiffContainer');
    const revertBtn = document.getElementById('inspectorRevertBtn');
    const revealBtn = document.getElementById('inspectorRevealBtn');

    if (diffContainer) diffContainer.style.display = 'none';

    if (isImage && data.dataUrl) {
      imgEl.src = data.dataUrl;
      imgContainer.style.display = 'flex';
      if (codeViewer) codeViewer.style.display = 'none';
      codeBox.style.display = 'block';
      codeBox.style.flex = '0 0 90px';
    } else {
      imgEl.src = '';
      imgContainer.style.display = 'none';
      codeBox.style.display = 'none';
      if (codeViewer) {
        const rawLines = (data.content || '').split(/\r?\n/);
        let viewerHtml = '';
        rawLines.forEach((l, idx) => {
          viewerHtml += `<div class="code-line"><span class="code-line-num">${idx + 1}</span><span class="code-line-content">${highlightCodeLine(l)}</span></div>`;
        });
        codeViewer.innerHTML = viewerHtml;
        codeViewer.style.display = 'block';
      }
    }

    codeBox.value = data.content || '';
    revealBtn.style.display = 'inline-flex';
    revertBtn.style.display = isBinary ? 'none' : 'inline-flex';
    revealBtn.onclick = () => hostPost({ action: 'revealFile', path: data.fullPath });
    revertBtn.onclick = () => {
      hostPost({ action: 'revertFile', path: data.fullPath });
      closeInspectorModal();
    };
    document.getElementById('inspectorModal').classList.add('open');
  }

  function openDiffInspector(eventId) {
    const sess = getActiveSession();
    if (!sess || !sess.UiEvents) return;
    const ev = sess.UiEvents.find(x => (x.Id || '') === eventId);
    if (!ev) return;

    if (!ev.FileEdits || ev.FileEdits.length === 0) {
      if (ev.FilePath) {
        hostPost({ action: 'inspectFile', path: ev.FilePath });
      }
      return;
    }

    const titleEl = document.getElementById('inspectorTitle');
    const metaEl = document.getElementById('inspectorMeta');
    const statsChips = document.getElementById('inspectorStatsChips');
    const imgContainer = document.getElementById('inspectorImageContainer');
    const codeBox = document.getElementById('inspectorCodeBox');
    const codeViewer = document.getElementById('inspectorCodeViewer');
    const diffContainer = document.getElementById('inspectorDiffContainer');

    if (codeViewer) codeViewer.style.display = 'none';
    const revertBtn = document.getElementById('inspectorRevertBtn');
    const revealBtn = document.getElementById('inspectorRevealBtn');

    if (imgContainer) imgContainer.style.display = 'none';
    if (codeBox) codeBox.style.display = 'none';
    if (diffContainer) diffContainer.style.display = 'flex';
    if (revertBtn) revertBtn.style.display = 'none';

    // Group edits by file path or name
    const fileGroups = {};
    let totalAdd = 0;
    let totalDel = 0;

    ev.FileEdits.forEach(ed => {
      const key = ed.filePath || ed.fileName;
      if (!fileGroups[key]) {
        fileGroups[key] = {
          fileName: ed.fileName,
          filePath: ed.filePath,
          relativePath: ed.relativePath || ed.fileName,
          edits: [],
          fileAdd: 0,
          fileDel: 0
        };
      }
      fileGroups[key].edits.push(ed);

      const lines = ed.diffLines || [];
      if (lines.length > 0) {
        lines.forEach(item => {
          if (item.type === 'add') {
            totalAdd++;
            fileGroups[key].fileAdd++;
          } else if (item.type === 'del') {
            totalDel++;
            fileGroups[key].fileDel++;
          }
        });
      } else {
        const sLines = (ed.searchBlock || '').split(/\r?\n/).filter(Boolean);
        const rLines = (ed.replaceBlock || '').split(/\r?\n/).filter(Boolean);
        totalDel += sLines.length;
        totalAdd += rLines.length;
        fileGroups[key].fileDel += sLines.length;
        fileGroups[key].fileAdd += rLines.length;
      }
    });

    const groupKeys = Object.keys(fileGroups);
    const fileCount = groupKeys.length;
    titleEl.textContent = `Inspect Code — ${ev.Content || (fileCount + ' files modified')}`;
    metaEl.textContent = `${fileCount} ${fileCount === 1 ? 'file' : 'files'} changed · Red (-) removed lines, Green (+) added lines`;

    if (statsChips) {
      statsChips.innerHTML = `

    let diffHtml = '';
    groupKeys.forEach(k => {
      const g = fileGroups[k];

              <span class="diff-stat-chip del" style="font-size:10px;">-${g.fileDel}</span>
              <span class="round-pill" style="font-size:10px;">${g.edits.length} ${g.edits.length === 1 ? 'hunk' : 'hunks'}</span>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
              <button class="btn-secondary emerald" style="padding:2px 8px;font-size:11px;" onclick="hostPost({ action: 'inspectFile', path: '${safePath}' })">View Full File</button>
              <button class="icon-btn-sm" title="Reveal in Explorer" onclick="hostPost({ action: 'revealFile', path: '${safePath}' })">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </button>
            </div>
          </div>
          <div class="diff-file-body">
      `;

      g.edits.forEach((ed, edIdx) => {
        diffHtml += `<div class="diff-chunk-divider">@@ Hunk #${edIdx + 1}: Search & Replace @@</div>`;

        const lines = ed.diffLines || [];
        if (lines.length === 0) {
          const sLines = (ed.searchBlock || '').split(/\r?\n/);
          const rLines = (ed.replaceBlock || '').split(/\r?\n/);
          sLines.forEach(l => {
            if (l.length > 0) {
              diffHtml += `<div class="diff-line diff-line-del"><span class="diff-line-prefix">-</span><span class="diff-line-content">${highlightCodeLine(l)}</span></div>`;
            }
          });
          rLines.forEach(l => {
            if (l.length > 0) {
              diffHtml += `<div class="diff-line diff-line-add"><span class="diff-line-prefix">+</span><span class="diff-line-content">${highlightCodeLine(l)}</span></div>`;
            }
          });
        } else {
          lines.forEach(item => {
            const t = item.type;
            const lineText = item.line || '';
            if (t === 'del') {
              diffHtml += `<div class="diff-line diff-line-del"><span class="diff-line-prefix">-</span><span class="diff-line-content">${highlightCodeLine(lineText)}</span></div>`;
            } else if (t === 'add') {
              diffHtml += `<div class="diff-line diff-line-add"><span class="diff-line-prefix">+</span><span class="diff-line-content">${highlightCodeLine(lineText)}</span></div>`;
            } else {
              diffHtml += `<div class="diff-line diff-line-ctx"><span class="diff-line-prefix"> </span><span class="diff-line-content">${highlightCodeLine(lineText)}</span></div>`;
            }
          });
        }
      });

      diffHtml += `
          </div>
        </div>
      `;
    });

    diffContainer.innerHTML = diffHtml;
    document.getElementById('inspectorModal').classList.add('open');

  function copyInspectorContent(btn) {
    const diffContainer = document.getElementById('inspectorDiffContainer');
    const codeBox = document.getElementById('inspectorCodeBox');

    if (diffContainer && diffContainer.style.display !== 'none') {
      textToCopy = diffContainer.innerText;
    } else if (codeBox && codeBox.value) {
      textToCopy = codeBox.value;
    }
    if (!textToCopy) return;
    navigator.clipboard.writeText(textToCopy).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';

  // Native File Drag-and-Drop via WebView2 CoreWebView2File
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    document.getElementById('dragOverlay').classList.add('visible');
  });
  window.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      document.getElementById('dragOverlay').classList.remove('visible');
    }
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();

  function showToast(text) {
