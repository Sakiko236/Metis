[package]
name = "metis"
version = "1.4.1"
description = "Metis - The Laser-Focused File-Centric Micro-Agent (Tauri + Python Sidecar)"
authors = ["Metis Developers"]
license = "MIT"
repository = "https://github.com/Sakiko236/Metis"
edition = "2021"

[lib]
name = "metis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.4", features = ["image-ico", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
open = "5.3"
rfd = "0.15"
