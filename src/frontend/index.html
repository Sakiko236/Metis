  function highlightCode(code, lang) {
    if (!code) return '';
    const l = (lang || '').toLowerCase().trim();
    if (l === 'text' || l === 'plain' || l === 'txt') {
      return escapeHtml(code);
    }

    if (l === 'html' || l === 'xml' || l === 'svg' || l === 'vue') {
      return code.replace(/(<!--[\s\S]*?(?:-->|$))|(<\/?)([a-zA-Z0-9:_-]+)([^>]*?)(\/?>|$)|([^<]+)/g, function(m, comment, open, tag, attrs, close, text) {
        if (comment) return '<span class="hl-comment">' + escapeHtml(comment) + '</span>';
        if (tag) {
          let res = escapeHtml(open || '') + '<span class="hl-tag">' + escapeHtml(tag) + '</span>';
          if (attrs) {
            res += attrs.replace(/([a-zA-Z0-9:_-]+)(\s*=\s*)(".*?"|'.*?'|[^\s>]+)?/g, function(am, aname, eq, aval) {
              let aRes = '<span class="hl-attr">' + escapeHtml(aname) + '</span>';
              if (eq) aRes += escapeHtml(eq);
              if (aval) aRes += '<span class="hl-string">' + escapeHtml(aval) + '</span>';
              return aRes;
            });
          }
          res += escapeHtml(close || '');
          return res;
        }
        return escapeHtml(text || m);
      });
    }

    const keywords = new Set([
      'abstract','as','assert','async','await','break','case','catch','class','const',
      'continue','debugger','default','defer','def','delete','do','echo','elif','else',
      'enum','export','extends','fallthrough','false','final','finally','fn','for','from',
      'func','function','global','go','goto','if','impl','import','in','inline','instanceof',
      'interface','is','lambda','let','match','module','mut','new','nil','none','not','null',
      'of','package','pass','pragma','private','protected','pub','public','raise','range',
      'readonly','ref','return','select','self','sizeof','static','struct','super','switch',
      'then','this','throw','trait','true','try','type','typeof','undefined','unsafe','use',
      'val','var','void','while','with','yield','select','insert','update','delete','create',
      'drop','alter','table','from','where','join','left','right','inner','outer','group',
      'order','having','limit','offset'
    ]);

    const types = new Set([
      'bool','boolean','byte','char','double','error','float','float32','float64',
      'int','int8','int16','int32','int64','uint','uint8','uint16','uint32','uint64',
      'uintptr','long','short','signed','unsigned','size_t','string','str','bytes',
      'dict','list','set','tuple','void','any','number','object','never','unknown',
      'symbol','bigint','map','chan','slice','array','vec','option','result'
    ]);

    const tokenRegex = /(\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*|#[^\n]*|--[^\n]*)|("(?:\\[\s\S]|[^"\\\n])*(?:"|$)|'(?:\\[\s\S]|[^'\\\n])*(?:'|$)|`(?:\\[\s\S]|[^`\\])*(?:`|$))|(\b0x[0-9a-fA-F]+\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(@[a-zA-Z_]\w*)|(\b[a-zA-Z_]\w*(?=\s*\())|([a-zA-Z_]\w*)|([\s\S])/g;

    return code.replace(tokenRegex, function(m, comment, str, num, deco, fn, word, other) {
      if (comment) return '<span class="hl-comment">' + escapeHtml(comment) + '</span>';
      if (str) return '<span class="hl-string">' + escapeHtml(str) + '</span>';
      if (num) return '<span class="hl-number">' + escapeHtml(num) + '</span>';
      if (deco) return '<span class="hl-decorator">' + escapeHtml(deco) + '</span>';
      if (fn) return '<span class="hl-fn">' + escapeHtml(fn) + '</span>';
      if (word) {
        const lower = word.toLowerCase();
        if (keywords.has(lower)) {
          return '<span class="hl-keyword">' + escapeHtml(word) + '</span>';
        }
        if (types.has(lower) || (/^[A-Z][a-zA-Z0-9_]*$/.test(word) && word.length > 1 && !/^[A-Z0-9_]+$/.test(word))) {
          return '<span class="hl-type">' + escapeHtml(word) + '</span>';
        }
        return escapeHtml(word);
      }
      return escapeHtml(other || m);
    });
  }

  function formatFallbackLatexInner(s) {
    if (!s) return '';
    s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
    s = s.replace(/\\left|\\right/g, '');
    s = s.replace(/\\(?:quad|qquad)/g, ' &emsp; ');
    s = s.replace(/\\(?:,|:|;|\s)/g, ' ');

    const greek = {
      'alpha': 'α', 'beta': 'β', 'gamma': 'γ', 'Gamma': 'Γ', 'delta': 'δ', 'Delta': 'Δ',
      'epsilon': 'ε', 'varepsilon': 'ε', 'zeta': 'ζ', 'eta': 'η', 'theta': 'θ', 'Theta': 'Θ',
      'iota': 'ι', 'kappa': 'κ', 'lambda': 'λ', 'Lambda': 'Λ', 'mu': 'μ', 'nu': 'ν',
      'xi': 'ξ', 'Xi': 'Ξ', 'pi': 'π', 'Pi': 'Π', 'rho': 'ρ', 'sigma': 'σ', 'Sigma': 'Σ',
      'tau': 'τ', 'upsilon': 'υ', 'phi': 'φ', 'Phi': 'Φ', 'chi': 'χ', 'psi': 'ψ', 'Psi': 'Ψ',
      'omega': 'ω', 'Omega': 'Ω'
    };
    for (const [k, v] of Object.entries(greek)) {
      s = s.replace(new RegExp('\\\\' + k + '(?![a-zA-Z])', 'g'), v);
    }

    const ops = {
      'times': '×', 'cdot': '·', 'div': '÷', 'pm': '±', 'mp': '∓',
      'le': '≤', 'leq': '≤', 'ge': '≥', 'geq': '≥', 'ne': '≠', 'neq': '≠',
      'approx': '≈', 'equiv': '≡', 'sim': '∼', 'in': '∈', 'notin': '∉',
      'subset': '⊂', 'subseteq': '⊆', 'cap': '∩', 'cup': '∪',
      'infty': '∞', 'partial': '∂', 'nabla': '∇',
      'sum': '<span class="math-op">∑</span>', 'prod': '<span class="math-op">∏</span>', 'int': '<span class="math-op">∫</span>',
      'to': '→', 'rightarrow': '→', 'leftarrow': '←', 'Rightarrow': '⇒', 'Leftarrow': '⇐',
      'iff': '⇔', 'Leftrightarrow': '⇔', 'forall': '∀', 'exists': '∃', 'emptyset': '∅'
    };
    for (const [k, v] of Object.entries(ops)) {
      s = s.replace(new RegExp('\\\\' + k + '(?![a-zA-Z])', 'g'), v);
    }

    s = s.replace(/\^\{([^{}]+)\}/g, '<sup>$1</sup>');
    s = s.replace(/\^([a-zA-Z0-9+\-=()])/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^{}]+)\}/g, '<sub>$1</sub>');
    s = s.replace(/_([a-zA-Z0-9+\-=()])/g, '<sub>$1</sub>');

    return s;
  }

  function formatFallbackLatex(latex, isBlock) {
    if (!latex) return '';
    let s = latex.trim();

    s = s.replace(/\\(?:text|mathrm|mathbf)\{([^{}]+)\}/g, '<span class="math-text">$1</span>');

    let fracRegex = /\\frac\{((?:[^{}]+|\{[^{}]*\})*)\}\{((?:[^{}]+|\{[^{}]*\})*)\}/g;
    while (fracRegex.test(s)) {
      s = s.replace(fracRegex, function(_, num, den) {
        return '<span class="math-frac"><span class="math-num">' + formatFallbackLatexInner(num) + '</span><span class="math-den">' + formatFallbackLatexInner(den) + '</span></span>';
      });
    }

    s = s.replace(/\\sqrt\[(.*?)\]\{((?:[^{}]+|\{[^{}]*\})*)\}/g, function(_, deg, rad) {
      return '<span class="math-sqrt"><sup>' + deg + '</sup>√<span class="math-radicand">' + formatFallbackLatexInner(rad) + '</span></span>';
    });
    s = s.replace(/\\sqrt\{((?:[^{}]+|\{[^{}]*\})*)\}/g, function(_, rad) {
      return '<span class="math-sqrt">√<span class="math-radicand">' + formatFallbackLatexInner(rad) + '</span></span>';
    });

    return '<span class="math-fallback">' + formatFallbackLatexInner(s) + '</span>';
  }

  function renderMathBlock(expr) {
    expr = (expr || '').trim();
    if (window.katex && typeof window.katex.renderToString === 'function') {
      try {
        return '<div class="md-math-block">' + window.katex.renderToString(expr, { displayMode: true, throwOnError: false }) + '</div>';
      } catch(e) {}
    }
    return '<div class="md-math-block">' + formatFallbackLatex(expr, true) + '</div>';
  }

  function renderMathInline(expr) {
    expr = (expr || '').trim();
    if (window.katex && typeof window.katex.renderToString === 'function') {
      try {
        return '<span class="md-math-inline">' + window.katex.renderToString(expr, { displayMode: false, throwOnError: false }) + '</span>';
      } catch(e) {}
    }
    return '<span class="md-math-inline">' + formatFallbackLatex(expr, false) + '</span>';
  }

  function formatSimpleMarkdown(text) {
    let raw = String(text == null ? '' : text);
    // Strip <metis_title>...</metis_title> and unclosed <metis_title>...
    raw = raw.replace(/<(?:metis|session|chat)_title\b[^>]*>[\s\S]*?<\/(?:metis|session|chat)_title>/gi, '');
    raw = raw.replace(/<(?:metis|session|chat)_title\b[^>]*>[\s\S]*$/gi, '');
    // Strip chain-of-thought <think>...</think> and unclosed <think>...
    raw = raw.replace(/<think\b[^>]*>[\s\S]*?<\/think>/gi, '');
    raw = raw.replace(/<think\b[^>]*>[\s\S]*$/gi, '');
    const trimmed = raw.trim();
    if (
      !trimmed ||
      trimmed === 'Thinking' ||
      trimmed === 'Thinking...' ||
      trimmed.startsWith('Thinking... (') ||
      trimmed === 'Generating...' ||
      trimmed === '<Generating...>' ||
      trimmed === '...' ||
      trimmed === '&lt;Generating...&gt;'
    ) {
      const label = (trimmed && trimmed.startsWith('Thinking')) ? trimmed : 'Thinking...';
      return '<span class="generating-placeholder">' + escapeHtml(label) + '</span>';
    }
    // Convert any raw <metis_replace> or legacy replace blocks into Markdown code blocks
    raw = raw.replace(/<(?:metis|pinpoint|surgical)_replace\s+file\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/(?:metis|pinpoint|surgical)_replace>/gi, function(_, f, code) {
      const ext = (f.split('.').pop() || '').toLowerCase();
      const lang = /^[a-z0-9_-]+$/i.test(ext) ? ext : 'diff';
      return '\n**Modify file `' + f + '` (Search/Replace):**\n```' + lang + '\n' + code.trim() + '\n```\n';
    });
    // Convert any raw <metis_write> or legacy write blocks into Markdown code blocks
    raw = raw.replace(/<(?:metis|pinpoint|surgical)_write\s+file\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/(?:metis|pinpoint|surgical)_write>/gi, function(_, f, code) {
      const ext = (f.split('.').pop() || '').toLowerCase();
      const lang = /^[a-z0-9_-]+$/i.test(ext) ? ext : '';
      return '\n**Write file `' + f + '`:**\n```' + lang + '\n' + code.trim() + '\n```\n';
    });
    // Strip search tags
    raw = raw.replace(/<(?:metis|pinpoint|surgical)?_?search\b[^>]*>[\s\S]*?<\/(?:metis|pinpoint|surgical)?_?search>/gi, '');
    raw = raw.replace(/<\/?(?:metis_cmd|pinpoint_cmd|surgical_cmd|verify_cmd|metis_search|pinpoint_search|surgical_search|search)>/gi, '');

    return renderMarkdownToHtml(raw.trim());
  }

  function isLikelyInlineMath(expr) {
    if (!expr) return false;
    const trimmed = expr.trim();
    if (!trimmed) return false;

    // Plain currency check: e.g. "100", "50.00", "20k", "10 USD", "50 EUR"
    if (/^[\d,]+(?:\.\d+)?(?:\s*(?:USD|RMB|EUR|CNY|HKD|dollars?|[kKmMbB]))?$/i.test(trimmed)) {
      return false;
    }

    // If it contains LaTeX commands or math symbols: \, ^, _, =, <, >, \pm, \approx, etc.
    if (/\\[a-zA-Z]+|[=^_+\-*/<>|~{}\[\]]/.test(trimmed)) {
      return true;
    }

    // If it's a short math expression (single variable, f(x), x_1, etc.)
    if (/^[a-zA-Z\d\s()',.]+$/.test(trimmed)) {
      if (/\b(?:and|or|the|is|are|in|on|at|to|for|with|of|from|by|was|were|has|have|cost|price|fee|pay|paid)\b/i.test(trimmed)) {
        return false;
      }
      return true;
    }

    return true;
  }

  function mdInline(s, displayMathBlocks) {
    if (!s) return '';
    // 1. Mask inline code first so formulas and dollar signs inside code are not touched
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, function(m, c) {
      codes.push(escapeHtml(c));
      return '\u0000' + (codes.length - 1) + '\u0000';
    });

    // 1.5 Protect escaped dollar signs: \$
    s = s.replace(/\\(\$)/g, '\u0002');

    // 2. Mask display math (pre-extracted placeholders and inline occurrences)
    const maths = [];
    if (displayMathBlocks && displayMathBlocks.length) {
      s = s.replace(/\uF001DM_(\d+)_\uF001/g, function(_, idx) {
        maths.push(renderMathBlock(displayMathBlocks[+idx]));
        return '\u0001' + (maths.length - 1) + '\u0001';
      });
    }
    s = s.replace(/(?:\\{1,4}\[)([\s\S]*?)(?:\\{1,4}\])/g, function(_, expr) {
      maths.push(renderMathBlock(expr.trim()));
      return '\u0001' + (maths.length - 1) + '\u0001';
    });
    s = s.replace(/\${2,4}([\s\S]+?)\${2,4}/g, function(_, expr) {
      maths.push(renderMathBlock(expr.trim()));
      return '\u0001' + (maths.length - 1) + '\u0001';
    });

    // 3. Mask inline math: \( ... \) or \\( ... \\) and $ ... $ (excluding plain currency)
    s = s.replace(/(?:\\{1,4}\()([\s\S]*?)(?:\\{1,4}\))/g, function(_, expr) {
      maths.push(renderMathInline(expr.trim()));
      return '\u0001' + (maths.length - 1) + '\u0001';
    });
    s = s.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)(?<!\$)\$(?!\$)/g, function(m, expr) {
      if (!isLikelyInlineMath(expr)) {
        return m;
      }
      maths.push(renderMathInline(expr.trim()));
      return '\u0001' + (maths.length - 1) + '\u0001';
    });

    // 4. Escape HTML for remaining text
    s = escapeHtml(s);

    // 5. Mask links BEFORE bold/italic so underscores/asterisks inside URLs or attributes are never mangled
    const links = [];
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '[$1]');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function(_, label, url) {
      links.push({ label: label, url: url });
      return '\u0003' + (links.length - 1) + '\u0003';
    });
    // Also auto-link bare https:// or http:// URLs not already inside a markdown link
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>"')\]]+)/g, function(m, prefix, url) {
      links.push({ label: url, url: url });
      return prefix + '\u0003' + (links.length - 1) + '\u0003';
    });

    // 6. Standard markdown formatting
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?![_\w])/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');

    // 7. Restore links, inline math, code and unescape \$
    s = s.replace(/\u0003(\d+)\u0003/g, function(m, i) {
      const item = links[+i];
      if (!item) return m;
      return '<a href="' + item.url + '" target="_blank" rel="noopener noreferrer">' + item.label + '</a>';
    });
    s = s.replace(/\u0001(\d+)\u0001/g, function(m, i) { return maths[+i]; });
    s = s.replace(/\u0000(\d+)\u0000/g, function(m, i) { return '<code>' + codes[+i] + '</code>'; });
    s = s.replace(/\u0002/g, '$');
    return s;
  }

  function buildCodeBlockHtml(rawCode, lang) {
    const highlighted = highlightCode(rawCode, lang);
    return '<div class="md-code">' +
      '<div class="md-code-header">' +
        '<span class="md-code-lang">' + escapeHtml(lang || 'CODE') + '</span>' +
        '<button class="btn-copy-code" onclick="copyCodeBlock(this)">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
          '<span>Copy</span>' +
        '</button>' +
      '</div>' +
      '<pre><code>' + highlighted + '</code></pre>' +
    '</div>';
  }

  function stripCommonIndent(lineStr, maxIndent) {
    if (!maxIndent || maxIndent <= 0) return lineStr;
    const expanded = lineStr.replace(/^\t+/, m => '    '.repeat(m.length));
    let removeCount = 0;
    while (removeCount < maxIndent && removeCount < expanded.length && expanded[removeCount] === ' ') {
      removeCount++;
    }
    return expanded.slice(removeCount);
  }

  function renderMarkdownToHtml(src, displayMathBlocks) {
    if (!displayMathBlocks) {
      displayMathBlocks = [];

      // 1. Mask fenced code blocks so formulas inside code are untouched
      const codeBlocks = [];
      src = src.replace(/(^|\n)(\s*```[^\n]*\n[\s\S]*?(?:\n\s*```\s*($|\n)|$))/g, function(m, p1, block, p3) {
        codeBlocks.push(block);
        return p1 + '\n\uF002CODEBLOCK_' + (codeBlocks.length - 1) + '_\uF002\n' + (p3 || '');
      });

      // 1.5 Mask inline code
      const inlineCodes = [];
      src = src.replace(/`([^`\n]+)`/g, function(m, c) {
        inlineCodes.push(c);
        return '\uF003INLINECODE_' + (inlineCodes.length - 1) + '_\uF003';
      });

      // 2. Pre-extract display math: \[ ... \] and \\[ ... \\]
      src = src.replace(/(?:\\{1,4}\[)([\s\S]*?)(?:\\{1,4}\])/g, function(_, expr) {
        let clean = expr;
        if (/^\s*>/m.test(clean)) clean = clean.replace(/^\s*>\s?/gm, '');
        displayMathBlocks.push(clean.trim());
        return '\uF001DM_' + (displayMathBlocks.length - 1) + '_\uF001';
      });

      // 3. Pre-extract $$ ... $$ and $$$$ ... $$$$
      src = src.replace(/\${2,4}([\s\S]+?)\${2,4}/g, function(_, expr) {
        let clean = expr;
        if (/^\s*>/m.test(clean)) clean = clean.replace(/^\s*>\s?/gm, '');
        displayMathBlocks.push(clean.trim());
        return '\uF001DM_' + (displayMathBlocks.length - 1) + '_\uF001';
      });

      // 4. Restore inline code and code blocks
      src = src.replace(/\uF003INLINECODE_(\d+)_\uF003/g, function(m, idx) {
        return '`' + inlineCodes[+idx] + '`';
      });
      src = src.replace(/\uF002CODEBLOCK_(\d+)_\uF002/g, function(m, idx) {
        return codeBlocks[+idx] || m;
      });
    }

    const lines = src.split(/\r?\n/);
    const out = [];
    let i = 0;
    const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf('-') >= 0;
    const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const isBlockStart = l =>
      /^\s*```/.test(l) || /^\s*\uF001DM_\d+_\uF001\s*$/.test(l) ||
      /^#{1,6}\s+/.test(l) || /^\s*>/.test(l) ||
      /^\s*[-*+]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l) ||
      /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);

    while (i < lines.length) {
      const line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      // Standalone display math block
      let dmMatch = line.match(/^\s*\uF001DM_(\d+)_\uF001\s*$/);
      if (dmMatch) {
        out.push(renderMathBlock(displayMathBlocks[+dmMatch[1]]));
        i++;
        continue;
      }

      // Fenced code block (closed or still streaming, top-level or indented)
      let m = line.match(/^(\s*)```([^\s`]*).*$/);
      if (m && !/^(\s*)```.+```/.test(line)) {
        const fenceIndent = m[1].replace(/\t/g, '    ').length;
        const lang = m[2] || '';
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
          buf.push(stripCommonIndent(lines[i], fenceIndent));
          i++;
        }
        if (i < lines.length && /^\s*```\s*$/.test(lines[i])) { i++; }
        out.push(buildCodeBlockHtml(buf.join('\n'), lang));
        continue;
      }

      // Heading
      m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (m) {
        const lv = m[1].length;
        out.push('<h' + lv + ' class="md-h">' + mdInline(m[2], displayMathBlocks) + '</h' + lv + '>');
        i++; continue;
      }

      // Horizontal rule
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push('<hr class="md-hr">'); i++; continue; }

      // Table
      if (line.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1])) {
        const head = splitRow(line);
        const aligns = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : (/-+:$/.test(c) ? 'right' : 'left'));
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].indexOf('|') >= 0 && !/^\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        let t = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
        head.forEach((h, k) => { t += '<th style="text-align:' + (aligns[k] || 'left') + '">' + mdInline(h, displayMathBlocks) + '</th>'; });
        t += '</tr></thead><tbody>';
        rows.forEach(r => {
          t += '<tr>';
          head.forEach((_, k) => { t += '<td style="text-align:' + (aligns[k] || 'left') + '">' + mdInline(r[k] || '', displayMathBlocks) + '</td>'; });
          t += '</tr>';
        });
        t += '</tbody></table></div>';
        out.push(t);
        continue;
      }

      // Blockquote
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote class="md-quote">' + renderMarkdownToHtml(buf.join('\n'), displayMathBlocks) + '</blockquote>');
        continue;
      }

      // Lists (with support for nested lists, indented fenced code blocks, and loose blank lines)
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const stack = []; // {type, indent}
        let html = '';
        while (i < lines.length) {
          const lm = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          if (!lm) {
            // 1. Check if an indented fenced code block starts inside the current list item
            const fenceMatch = lines[i].match(/^(\s*)```([^\s`]*).*$/);
            if (fenceMatch && !/^(\s*)```.+```/.test(lines[i]) && stack.length) {
              const fenceIndent = fenceMatch[1].replace(/\t/g, '    ').length;
              const lang = fenceMatch[2] || '';
              const codeBuf = [];
              i++;
              while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
                codeBuf.push(stripCommonIndent(lines[i], fenceIndent));
                i++;
              }
              if (i < lines.length && /^\s*```\s*$/.test(lines[i])) { i++; }
              html += buildCodeBlockHtml(codeBuf.join('\n'), lang);
              continue;
            }
            // 2. Check if blank line inside a loose list followed by another list item or indented block
            if (/^\s*$/.test(lines[i]) && stack.length && i + 1 < lines.length &&
                (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i + 1]) || /^\s{2,}\S/.test(lines[i + 1]))) {
              i++;
              continue;
            }
            // 3. Continuation line (indented text) belongs to previous item
            if (/^\s{2,}\S/.test(lines[i]) && stack.length) {
              html += '<br>' + mdInline(lines[i].trim(), displayMathBlocks);
              i++;
              continue;
            }
            break;
          }
          const indent = lm[1].replace(/\t/g, '    ').length;
          const type = /\d/.test(lm[2]) ? 'ol' : 'ul';
          while (stack.length && indent < stack[stack.length - 1].indent) {
            html += '</li></' + stack.pop().type + '>';
          }
          if (!stack.length || indent > stack[stack.length - 1].indent) {
            html += '<' + type + ' class="md-list">';
            stack.push({ type: type, indent: indent });
          } else {
            html += '</li>';
          }
          let body = lm[3];
          const task = body.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) body = (task[1] === ' ' ? '☐ ' : '☑ ') + task[2];
          html += '<li>' + mdInline(body, displayMathBlocks);
          i++;
        }
        while (stack.length) html += '</li></' + stack.pop().type + '>';
        out.push(html);
        continue;
      }

      // Paragraph
      const buf = [line];
      i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i]) &&
             !(lines[i].indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1]))) {
        buf.push(lines[i]); i++;
      }
      out.push('<p class="md-p">' + buf.map(l => mdInline(l, displayMathBlocks)).join('<br>') + '</p>');
    }
    return out.join('');
  }

  // Intercept external links and open in system default browser
  document.addEventListener('click', (e) => {
    const anchor = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!anchor) return;
    const href = (anchor.getAttribute('href') || '').trim();
    if (/^(https?:\/\/|mailto:)/i.test(href)) {
      e.preventDefault();
      e.stopPropagation();
      hostPost({ action: 'openUrl', url: href });
    }
  });

  // Notify host that UI is ready
  window.addEventListener('DOMContentLoaded', () => {
    setupTitlebarEvents();
    setupWindowResizeHandles();
    try {
      const saved = localStorage.getItem('metis_thinking_intensity') || localStorage.getItem('pinpoint_thinking_intensity');
      if (saved && saved !== 'off') currentThinkingIntensity = saved;
      else currentThinkingIntensity = 'medium';
    } catch(e) {}
    setTimeout(() => updateThinkingGlider(currentThinkingIntensity), 60);
    hostPost({ action: 'uiReady' });
  });
</script>
</body>
</html>
